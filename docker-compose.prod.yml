services:
  web:
    restart: always
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1

  api:
    restart: always
    environment:
      ENVIRONMENT: production
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G

  db:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
